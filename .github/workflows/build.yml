name: Build RUNE Mobile APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp ${{ runner.temp }}/llama-src

      - name: Configure llama.cpp for Android
        run: |
          cmake -S ${{ runner.temp }}/llama-src -B ${{ runner.temp }}/llama-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DLLAMA_CURL=OFF \
            -DGGML_OPENMP=OFF

      - name: Build llama.cpp for Android
        run: cmake --build ${{ runner.temp }}/llama-build --config Release -j 4

      - name: Clone stable-diffusion.cpp
        run: git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp ${{ runner.temp }}/sd-src

      - name: Configure stable-diffusion.cpp for Android
        run: |
          cmake -S ${{ runner.temp }}/sd-src -B ${{ runner.temp }}/sd-build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF

      - name: Build stable-diffusion.cpp for Android
        run: cmake --build ${{ runner.temp }}/sd-build --config Release -j 4

      - name: Copy native libraries into project
        run: |
          mkdir -p lib/arm64-v8a
          find ${{ runner.temp }}/llama-build -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          find ${{ runner.temp }}/sd-build -name "*.so" -exec cp {} lib/arm64-v8a/ \;
          ls -la lib/arm64-v8a/

      - name: Restore dependencies
        run: dotnet restore RuneMobile.csproj

      - name: Build APK
        run: dotnet build RuneMobile.csproj -f net9.0-android -c Release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RUNE-Mobile-APK
          path: bin/Release/net9.0-android/*Signed.apk
